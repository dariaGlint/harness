[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "production-harness"
version = "0.1.0"
description = "Reusable fail-closed primitives for resumable workflows and GitHub publication"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "dariaGlint"}]
keywords = ["workflow", "resumable", "orchestration", "ci", "harness", "github"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
production-harness = "production_harness.cli:main"
workspace-commit-bridge = "production_harness.commit_bridge_cli:main"
evidence-ledger = "production_harness.evidence_ledger_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
production_harness = ["schemas/*.json"]
